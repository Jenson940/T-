<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>T门动态速写</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T门动态速写">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
    /* 核心颜色变量 */
    :root{
        --bg-canvas:#EBE5F5;
        --bg-panel:#FFFFFF;
        --bg-panel-alt:#F4EFFB;
        --bg-panel-hover:#ECE4F7;
        --border:#D6C8EE;
        --border-soft:#E4DCF4;
        --text:#2D253A;
        --text-muted:#7A6E8D;
        --text-faint:#AB9FC0;
        --ink:#2D253A;
        --accent:#9D75E6;
        --accent-hover:#8B5FD6;
        --accent-ink:#FFFFFF;
        --accent-soft:rgba(157,117,230,.15);
        --mode-class:#D2A272;
        --mode-class-soft:#F8F0E3;
        --mode-relaxed:#8FAAC0;
        --mode-relaxed-soft:#EEF3F6;
        --mode-custom:#BB8CA6;
        --mode-custom-soft:#F6ECF1;
        --rest:#D8B378;
        --rest-ink:#221F19;
        --rest-soft:#F9F0DE;
        --danger:#C2564A;
        --danger-soft:#F6E3E0;
    }
    
    /* 基础重置 (摆脱外部依赖) */
    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{
        height: 100%; width: 100%;
        background:var(--bg-canvas);
        color:var(--text);
        font-family:'Inter',sans-serif;
        overflow:hidden;
        -webkit-tap-highlight-color: transparent;
    }
    .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
    .font-round{font-family:'Fraunces',ui-serif,'Inter',sans-serif; font-optical-sizing:auto;}
    
    /* 图标统一样式 */
    i[data-icon], i.icon-inline{ display:inline-flex; width:1em; height:1em; align-items:center; justify-content:center; }
    i[data-icon] svg, i.icon-inline svg{ width:1em; height:1em; display:block; flex-shrink:0; vertical-align:middle; }
    .hidden-ui{display:none !important;}
    
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

    /* ================= 设置主屏幕 ================= */
    #setup-screen{
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
            radial-gradient(ellipse 800px 480px at 12% -8%, rgba(157,117,230,.22), transparent 60%),
            radial-gradient(ellipse 700px 420px at 105% 10%, rgba(210,162,114,.16), transparent 60%),
            radial-gradient(ellipse 700px 460px at 0% 105%, rgba(187,140,166,.14), transparent 55%),
            var(--bg-canvas);
    }
    .setup-card{
        background:var(--bg-panel);
        border:1px solid var(--border-soft);
        border-radius:28px;
        box-shadow:0 30px 60px -25px rgba(45,37,58,.22), 0 2px 8px rgba(45,37,58,.04);
        width: 540px; max-width: 92%;
        padding: 36px 40px;
        display: flex; flex-direction: column; align-items: center;
    }
    .setup-title { font-size: 30px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.025em; }
    .setup-title .highlight { font-weight: 700; color: var(--accent-hover); }
    .setup-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 28px; letter-spacing: 0.025em; }

    /* 文件选择器 */
    .folder-drop{
        width: 100%; padding: 16px 0; text-align: center; cursor: pointer;
        font-size: 15px; font-weight: 600;
        border:1.5px solid transparent; border-radius:18px;
        background:rgba(157,117,230,.12);
        transition:background .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
    }
    .folder-drop:hover{ background:var(--bg-panel); border-color:var(--accent); box-shadow:0 8px 20px -12px rgba(157,117,230,.5); transform:translateY(-1px); }
    .folder-drop:hover .folder-drop-icon{ color:var(--accent); }
    .folder-drop:active{ transform:scale(.985); }
    .folder-drop-icon { margin-right: 8px; color: var(--accent-hover); }
    #file-input { display: none !important; } /* 彻底隐藏原生按钮 */
    #folder-status { font-size: 12px; color: var(--text-muted); margin-top: 8px; min-height: 16px; text-align: center; }

    /* 模式面板 */
    .mode-section { width: 100%; border-top: 1px solid var(--border-soft); padding-top: 24px; margin-top: 20px; }
    .mode-title { text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.05em; }
    .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom: 20px; }
    
    .tab-btn{
        padding:16px 10px; display:flex; flex-direction:column; align-items:flex-start; gap:14px;
        cursor:pointer; color:var(--text-muted); background:var(--bg-panel-alt);
        border-radius:18px; transition:background .18s ease, color .18s ease, transform .15s ease, box-shadow .18s ease, border-color .18s ease;
        position:relative; border:1.5px solid transparent; overflow:hidden;
    }
    .tab-btn:hover{ transform:translateY(-2px); border-color:var(--border); box-shadow:0 10px 22px -14px rgba(45,37,58,.25); }
    .tab-btn .tab-icon{
        width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center;
        background:rgba(255,255,255,.7); font-size:16px; transition:background .18s ease, transform .18s ease;
    }
    .tab-btn:hover .tab-icon{ transform:scale(1.06); }
    .tab-btn[data-tab="practice"].active{ background:var(--accent); color:var(--accent-ink); box-shadow:0 12px 24px -14px rgba(157,117,230,.7); }
    .tab-btn[data-tab="class"].active{ background:var(--mode-class); color:var(--accent-ink); box-shadow:0 12px 24px -14px rgba(210,162,114,.7); }
    .tab-btn[data-tab="relaxed"].active{ background:var(--mode-relaxed); color:var(--accent-ink); box-shadow:0 12px 24px -14px rgba(143,170,192,.7); }
    .tab-btn[data-tab="custom"].active{ background:var(--mode-custom); color:var(--accent-ink); box-shadow:0 12px 24px -14px rgba(187,140,166,.7); }
    .tab-btn.active{ transform:translateY(-1px); }
    .tab-btn.active .tab-icon{ background:rgba(255,255,255,.25); }
    .tab-btn span{ font-size:13.5px; font-weight:600; }

    .tab-content-container { min-height: 92px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    
    .time-btn-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; width: 100%; }
    .time-btn{
        background:var(--bg-panel-alt); color:var(--text-muted); border:1.5px solid var(--border-soft);
        padding:9px 14px; cursor:pointer; font-size:13.5px; border-radius:99px; transition:all .15s ease; font-weight:500;
    }
    .time-btn:hover:not(.active):not(.is-disabled){ background:var(--bg-panel-hover); color:var(--text); border-color:var(--border); transform:translateY(-1px); }
    .time-btn.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; box-shadow:0 8px 16px -10px rgba(157,117,230,.7); }
    .time-btn:active:not(.is-disabled){ transform:scale(.96); }

    /* 通用按钮 */
    .btn-primary{
        background:var(--ink); color:#fff; font-weight:600; border:none; outline:none;
        transition:background .18s ease, transform .12s ease, box-shadow .18s ease;
        box-shadow:0 10px 26px -10px rgba(45,37,58,.35);
        position:relative; overflow:hidden; cursor:pointer;
    }
    .btn-primary::after{
        content:""; position:absolute; inset:0; opacity:0;
        background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.14) 50%, transparent 70%);
        transform:translateX(-100%); transition:opacity .2s ease;
    }
    .btn-primary:hover::after{ opacity:1; animation:btnSheen 1.1s ease; }
    @keyframes btnSheen{ from{ transform:translateX(-100%); } to{ transform:translateX(100%); } }
    .btn-primary:hover{ background:#423753; box-shadow:0 14px 30px -10px rgba(45,37,58,.45); }
    .btn-primary:active{ transform:scale(.98); }
    .btn-primary:disabled{ background:var(--bg-panel-alt); color:var(--text-faint); box-shadow:none; cursor:not-allowed; }
    .btn-primary:disabled::after{ display:none; }
    
    .start-btn { width: 100%; padding: 14px 0; font-size: 15px; border-radius: 99px; margin-top: 8px; letter-spacing: 0.025em; }

    .btn-ghost{
        background:var(--bg-panel-alt); color:var(--text); border:1px solid var(--border-soft);
        transition:all .15s ease; border-radius: 8px; cursor: pointer; outline: none;
    }
    .btn-ghost:hover{ background:var(--bg-panel-hover); border-color:var(--border); transform:translateY(-1px); }
    .btn-ghost:active{ transform:scale(.97); }
    .footer-btn { padding: 8px 24px; font-size: 14px; }

    /* ================= 播放界面 ================= */
    #play-screen{
        position: fixed; inset: 0; background: #18141F; overflow: hidden; z-index: 50;
    }
    #play-vignette{
        position:absolute; inset:0; pointer-events:none; z-index:1;
        background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
    }
    /* 图片完全脱离文档流，绝对定位满屏，靠 object-fit 缩放不影响任何 UI */
    #canvas-img{
        position:absolute; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: contain; 
        transition: transform .2s ease, filter .2s ease, opacity .3s ease;
        will-change: transform; /* 【修复】强制浏览器做硬件加速准备 */
        z-index: 2; pointer-events: none;
    }
    #canvas-img.is-resting{ opacity:.15; filter:blur(2px) grayscale(60%); }

    /* 检测点击的透明层 */
    #interaction-layer { position: absolute; inset: 0; z-index: 5; cursor: default; touch-action: none; }

    #grid-overlay{
        position:absolute; inset:0; pointer-events:none; z-index: 3;
        background-image: linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
        background-size:100px 100px; background-position:center center;
    }

    #top-info{
        position:absolute; top:18px; left:50%; transform:translateX(-50%);
        text-align:center; color:rgba(255,255,255,.85); font-size:13px; z-index:10; pointer-events:none;
        background:rgba(30,25,38,.65); backdrop-filter:blur(8px);
        padding:6px 16px; border-radius:99px; border:1px solid rgba(255,255,255,.08);
    }
    #top-info #info-details{ color:rgba(255,255,255,.5); }

    #progress-track{
        position:absolute; top:0; left:0; height:3px; background:var(--mode-color, var(--accent)); z-index:11;
        transition:width .3s linear, background .3s ease; box-shadow:0 0 12px color-mix(in srgb, var(--mode-color, var(--accent)) 60%, transparent);
    }

    #step-counter{
        position:absolute; top:18px; left:18px; z-index:10;
        font-size:12px; color:rgba(255,255,255,.7); background:rgba(30,25,38,.65);
        backdrop-filter:blur(8px); padding:6px 12px; border-radius:99px;
        border:1px solid rgba(255,255,255,.08); letter-spacing:.02em;
    }

    #timer-badge{
        position:absolute; top:16px; right:16px; z-index:10;
        width:78px; height:78px; display:flex; align-items:center; justify-content:center;
    }
    #timer-badge svg{ position:absolute; inset:0; transform:rotate(-90deg); }
    #timer-ring-bg{ stroke:rgba(255,255,255,.12); }
    #timer-ring-fg{ stroke:var(--mode-color, var(--accent)); transition:stroke-dashoffset 1s linear, stroke .3s ease; stroke-linecap:round; }
    #timer-badge.is-rest #timer-ring-fg{ stroke:var(--rest); }
    #timer-badge.is-danger #timer-ring-fg{ stroke:var(--danger) !important; }
    #timer-badge.is-danger #timer-display{ color:var(--danger) !important; animation:pulseWarning .8s ease infinite alternate; }
    @keyframes pulseWarning{ from{ transform:scale(1); } to{ transform:scale(1.08); } }
    #timer-display{ font-size:19px; font-weight:600; color:white; z-index:2; letter-spacing:.02em; text-shadow:0 1px 3px rgba(0,0,0,.6); transition:color .3s ease; }

    #rest-overlay{
        position:absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index:9; display:flex; flex-direction:column; align-items:center; gap:10px;
        color:rgba(255,255,255,.92); pointer-events:none;
    }
    #rest-overlay i{ font-size:34px; color:var(--rest); }
    #rest-overlay span{ font-size:15px; letter-spacing:.04em; }

    /* 底部控制栏 */
    .bottom-toolbar{
        position:absolute; bottom:22px; left:50%; z-index:20;
        background:rgba(28,23,36,.92); backdrop-filter:blur(16px);
        border:1px solid rgba(255,255,255,.08); border-radius:32px; padding:14px 24px 12px;
        display:flex; flex-direction:column; align-items:center; gap:10px;
        box-shadow:0 24px 50px -14px rgba(0,0,0,.6);
        opacity:0; transform:translate(-50%,16px); transition:opacity .25s ease, transform .25s ease;
    }
    /* 【修复】排除了触控设备，解决 iPad 笔离开后工具栏卡住不消失的 Bug */
    body:not(.touch-device) #play-screen:hover .bottom-toolbar { opacity:1; transform:translate(-50%,0); }
    #play-screen.toolbar-pinned .bottom-toolbar { opacity:1; transform:translate(-50%,0); }
    
    .toolbar-row-divider{ width:100%; height:1px; background:rgba(255,255,255,.08); }

    .controls-main{ display:flex; align-items:center; gap:22px; }
    .ctrl-btn{
        color:#fff; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
        font-size:16px; background:rgba(255,255,255,.06); transition:background .16s ease, transform .16s ease, box-shadow .16s ease;
        border: none; cursor: pointer; outline: none;
    }
    .ctrl-btn:hover{ background:rgba(255,255,255,.14); transform:scale(1.07); box-shadow:0 4px 14px -4px rgba(0,0,0,.5); }
    .ctrl-btn:active{ transform:scale(.9); }
    .ctrl-btn.big{ width:54px; height:54px; font-size:19px; background:var(--mode-color, var(--accent)); color:var(--accent-ink); box-shadow:0 6px 18px -6px var(--mode-color, var(--accent)); }
    .ctrl-btn.big:hover{ filter:brightness(1.1); transform:scale(1.06); box-shadow:0 8px 22px -6px var(--mode-color, var(--accent)); }
    .ctrl-btn.big:active{ transform:scale(.94); }
    .skip-btn{
        display:flex; align-items:center; gap:6px; color:rgba(255,255,255,.7); font-size:12.5px;
        letter-spacing:.06em; text-transform:uppercase; font-weight:600; transition:color .15s ease, transform .15s ease;
        background: none; border: none; cursor: pointer;
    }
    .skip-btn:hover{ color:#fff; transform:translateX(2px); }

    .controls-tools{ display:flex; align-items:center; gap:6px; font-size:15px; color:#b0a6c2; }
    .tool-btn{
        width:36px; height:36px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center;
        font-size:16px; transition:background .15s ease, color .15s ease;
        background: none; border: none; cursor: pointer; color: inherit;
    }
    .tool-btn svg{ width:1em; height:1em; display:block; flex-shrink:0; }
    .tool-btn:hover{ background:rgba(255,255,255,.08); color:#fff; }
    .tool-btn:active{ transform:scale(.95); }
    .tool-btn.active{ background:rgba(157,117,230,.25); color:#d9c9fb; box-shadow:none; }
    .tool-divider{ width:1px; height:18px; background:rgba(255,255,255,.14); margin:0 2px; }

    /* ================= 弹窗与悬浮 ================= */
    #custom-modal-overlay{
        position:fixed; inset:0; background:rgba(18,14,24,.75); backdrop-filter:blur(3px);
        display:flex; justify-content:center; align-items:center; z-index:100;
        animation:overlayFadeIn .2s ease;
    }
    .custom-modal{
        background:var(--bg-panel); border-radius:16px; box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
        width:660px; max-width: 94%; display:flex; flex-direction:column; border:1px solid var(--border-soft); overflow:hidden;
        animation:modalPopIn .25s cubic-bezier(.2,.8,.3,1.1); position:relative;
    }
    .custom-modal::before{
        content:""; position:absolute; top:0; left:15%; right:15%; height:1px; z-index:1;
        background:linear-gradient(90deg, transparent, rgba(157,117,230,.5), transparent);
    }
    .modal-header { text-align: center; padding: 14px 0; border-bottom: 1px solid var(--border-soft); font-size: 15px; font-weight: 500; }
    .custom-modal-flex{ display:flex; height:320px; }
    .custom-modal-left{ width:50%; border-right:1px solid var(--border-soft); display:flex; flex-direction:column; background:var(--bg-canvas); }
    #row-list{ flex:1; overflow-y:auto; padding:10px; }
    .modal-left-toolbar{ padding: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
    
    .custom-modal-right{ width:50%; padding:20px; display:flex; flex-direction:column; align-items:center; }
    .right-title{ color:var(--text-muted); font-size:12px; margin-bottom:16px; letter-spacing:0.05em; font-weight: 600; }
    .field-wrap{ margin-bottom:16px; text-align:center; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .field-label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; }
    
    .time-inputs{ display:flex; align-items:center; justify-content: center; gap:6px; }
    .field-input{
        background:var(--bg-panel-alt); border:1px solid var(--border-soft); color:var(--text);
        border-radius:7px; text-align:center; transition:border-color .15s ease;
        padding: 6px 0; outline: none;
    }
    .field-input:focus{ border-color:var(--accent); }
    .w-16{ width:64px; } .w-11{ width:44px; }
    .unit-text{ font-size:12px; color:var(--text-muted); }
    
    .subtotal-text{ font-size:12px; color:var(--text-muted); margin-bottom:16px; }
    .total-wrap{ margin-top:auto; text-align:center; width:100%; border-radius:8px; padding:12px 0; background:var(--bg-panel-alt); }
    .total-title{ font-size:12px; color:var(--text-muted); margin:0; }
    .total-val{ font-size:20px; color:var(--accent); margin-top:2px; margin-bottom:0; font-weight: 600; }
    
    .modal-footer{ display:flex; justify-content:flex-end; gap:8px; padding:12px; border-top:1px solid var(--border-soft); }

    @keyframes overlayFadeIn{ from{ opacity:0; } to{ opacity:1; } }
    @keyframes modalPopIn{ from{ opacity:0; transform:scale(.96) translateY(6px); } to{ opacity:1; transform:scale(1) translateY(0); } }
    @keyframes rowFlashIn{ 0%{ background:var(--accent-soft); transform:translateX(-4px); } 100%{ background:var(--bg-panel-alt); transform:translateX(0); } }
    
    .row-item.just-added{ animation:rowFlashIn .6s ease; }
    .row-item{
        display:flex; align-items:center; gap:10px; padding:9px 12px 9px 10px; border-radius:9px; margin-bottom:5px; cursor:pointer;
        background:var(--bg-panel-alt); border-left:2.5px solid transparent; transition:all .15s ease; font-size:13px;
    }
    .row-item:hover{ background:var(--bg-panel-hover); transform:translateX(1px); }
    .row-item.selected{ border-left-color:var(--accent); background:rgba(157,117,230,.15); box-shadow:0 2px 10px -4px rgba(0,0,0,.35); }
    .row-item.is-rest{ color:var(--rest); }
    .row-item.is-rest.selected{ border-left-color:var(--rest); background:var(--rest-soft); }
    .row-step-badge{
        flex-shrink:0; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
        font-size:10.5px; font-weight:600; background:var(--bg-panel-hover); color:var(--text-faint); font-family:'JetBrains Mono',monospace;
    }
    .row-item.selected .row-step-badge{ background:var(--accent); color:var(--accent-ink); }
    .row-item.is-rest.selected .row-step-badge{ background:var(--rest); color:var(--rest-ink); }
    .row-item-text{ flex:1; display:flex; align-items:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .modal-tool-btn{
        width:32px; height:32px; border-radius:7px; display:flex; align-items:center; justify-content:center;
        color:var(--text-muted); transition:all .15s ease; border: none; background: none; cursor: pointer;
    }
    .modal-tool-btn:hover{ background:var(--bg-panel-hover); color:var(--text); transform:translateY(-1px); }
    .modal-tool-btn:active{ transform:scale(.92); }
    .modal-tool-btn:disabled{ opacity:.3; cursor:not-allowed; }
    .modal-tool-btn:disabled:hover{ background:none; color:var(--text-muted); transform:none; }
    .modal-tool-btn-danger:hover{ background:var(--danger-soft); color:var(--danger); }

    .toolbar-segment{ display:flex; align-items:center; gap:2px; background:var(--bg-canvas); border:1px solid var(--border-soft); border-radius:10px; padding:2px; }

    .popover{
        position:absolute; background:var(--bg-panel-alt); border:1px solid var(--border);
        border-radius:10px; box-shadow:0 20px 40px -12px rgba(0,0,0,.5); z-index:200; overflow:hidden; min-width:200px; padding: 10px;
    }
    .popover-input { width: 100%; padding: 6px 8px; font-size: 14px; margin-bottom: 8px; box-sizing: border-box; text-align: left; }
    .popover-item{
        display:flex; align-items:center; justify-content:space-between; gap:8px;
        padding:9px 12px; font-size:13px; cursor:pointer; transition:background .12s ease; margin: -10px -10px 0 -10px;
    }
    .popover-item:not(:first-child) { margin-top: 0; }
    .popover-item:hover{ background:var(--bg-panel-hover); }
    .popover-item .del-x{ color:var(--text-faint); transition:color .12s ease; }
    .popover-item .del-x:hover{ color:var(--danger); }

    #toast-stack{
        position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
        z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;
    }
    .toast{
        background:var(--bg-panel-alt); border:1px solid var(--border); color:var(--text);
        padding:10px 18px; border-radius:99px; font-size:13.5px; box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
        opacity:0; transform:translateY(8px); transition:opacity .25s ease, transform .25s ease;
        display:flex; align-items:center; gap:8px;
    }
    .toast.show{ opacity:1; transform:translateY(0); }
    .toast i{ color:var(--accent); }

    .screen-fade{ animation:screenFadeIn .35s ease; }
    @keyframes screenFadeIn{ from{ opacity:0; } to{ opacity:1; } }

    /* ================= 触控设备 & 安全区适配 (iPad / 手机) ================= */
    /* 圆角屏、Home 指示条留白，避免控件被系统手势遮挡/误触 */
    .bottom-toolbar{ margin-bottom: env(safe-area-inset-bottom, 0px); }
    #top-info{ margin-top: env(safe-area-inset-top, 0px); }
    #timer-badge{ margin-top: env(safe-area-inset-top, 0px); margin-right: env(safe-area-inset-right, 0px); }
    #step-counter{ margin-top: env(safe-area-inset-top, 0px); margin-left: env(safe-area-inset-left, 0px); }
    #toast-stack{ margin-bottom: env(safe-area-inset-bottom, 0px); }

    /* 触控设备上放大可点击热区 (Apple HIG 建议 ≥44px)，避免误触 */
    .touch-device .tool-btn{ width:44px; height:44px; }
    .touch-device .ctrl-btn{ width:50px; height:50px; }
    .touch-device .ctrl-btn.big{ width:60px; height:60px; }
    .touch-device .time-btn{ padding:11px 16px; }

    /* 图片查看缩放 (双击放大细看动态/结构) */
    #canvas-img.is-zoomed{ cursor: grab; transition: transform .15s ease-out; }
    #canvas-img.is-zoomed.is-dragging{ transition: none !important; cursor: grabbing; } /* 【修复】强制移除过渡动画防止手势卡顿 */
    /* 拖拽文件到设置界面 */
    .folder-drop.drag-over{ background:var(--bg-panel); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }

    /* 响应式调整 (手机与平板) */
    @media (max-width: 640px) {
        .setup-card { padding: 24px 20px; }
        .setup-title { font-size: 24px; }
        .mode-grid { gap: 8px; }
        .tab-btn { padding: 12px 8px; gap: 8px; }
        .tab-btn .tab-icon { width: 28px; height: 28px; font-size: 14px; }
        .custom-modal { max-height: 90vh; }
        .custom-modal-flex { flex-direction: column; height: auto !important; max-height: 70vh; overflow-y: auto; }
        .custom-modal-left, .custom-modal-right { width: 100% !important; border-right: none; }
        .bottom-toolbar { width: 94%; padding: 10px 12px 8px; }
        .controls-main { gap: 12px; }
        .ctrl-btn { width: 42px; height: 42px; font-size: 14px; }
        .ctrl-btn.big { width: 52px; height: 52px; font-size: 17px; }
        .controls-tools { flex-wrap: wrap; justify-content: center; gap: 4px; }
        .tool-btn { width: 40px; height: 40px; }
        #timer-badge { width: 56px; height: 56px; top: 10px; right: 10px; }
        #timer-badge svg { width: 56px; height: 56px; }
        #timer-display { font-size: 14px; }
    }
</style>
</head>
<body>

<!-- 设置界面 -->
<div id="setup-screen">
    <div class="setup-card screen-fade">
        <h1 class="font-round setup-title">速写<span class="highlight">训练</span></h1>
        <p class="setup-subtitle">T门动态速写 &middot; 手绘参考计时工具</p>

        <!-- 文件夹选择区 (桌面支持拖拽文件夹/图片到此处) -->
        <div id="folder-btn" class="folder-drop" onclick="document.getElementById('file-input').click()">

        </div>
        <input type="file" id="file-input" webkitdirectory directory multiple accept="image/*">
        <p id="folder-status"></p>
        <p id="platform-hint" class="hidden-ui" style="font-size:11px; color:var(--text-faint); margin-top:2px; text-align:center; line-height:1.5;"></p>

        <!-- 模式面板 -->
        <div class="mode-section">
            <p class="mode-title">训练模式</p>
            <div class="mode-grid">
                <div class="tab-btn active" data-tab="practice">
                    <span class="tab-icon"><i data-icon="stopwatch"></i></span>
                    <span>定时练习</span>
                </div>
                <div class="tab-btn" data-tab="class">
                    <span class="tab-icon"><i data-icon="graduation-cap"></i></span>
                    <span>课堂模式</span>
                </div>
                <div class="tab-btn" data-tab="relaxed">
                    <span class="tab-icon"><i data-icon="chair"></i></span>
                    <span>休闲模式</span>
                </div>
                <div class="tab-btn" data-tab="custom">

        <button id="start-btn" class="btn-primary start-btn" disabled>

</div>

<!-- 自定义模态框 -->
<div id="custom-modal-overlay" class="hidden-ui">
    <div class="custom-modal">
        <div class="modal-header">自定义训练计划</div>
        <div class="custom-modal-flex">
            <!-- 左侧列表 -->
            <div class="custom-modal-left">
                <div id="row-list"></div>
                <div class="modal-left-toolbar">
                    <div class="toolbar-segment">
                        <button class="modal-tool-btn" title="新增绘画任务" onclick="addRow(false)"><i data-icon="plus"></i></button>

        </div>
    </div>
</div>

<div id="toast-stack"></div>

<script>
// ============================================================
// SVG 图标库
// ============================================================
const ICONS = {
    'folder-open': '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H3Z"/><path d="m3 8 1.2 9.4A2 2 0 0 0 6.2 19h11.6a2 2 0 0 0 2-1.6L21 10H3Z"/>',

    'mug-hot': '<path d="M4 9h11v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9Z"/><path d="M15 10.5h1.5a2.5 2.5 0 0 1 0 5H15"/><path d="M7 2c0 1-1 1-1 2s1 1 1 2M11 2c0 1-1 1-1 2s1 1 1 2"/>',

    'chevron-left': '<path d="M15 5 8 12l7 7"/>',
    'chevron-right': '<path d="M9 5l7 7-7 7"/>',
    'pause': '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
    'play': '<path d="M7 4.2v15.6a.7.7 0 0 0 1.06.6l12.7-7.8a.7.7 0 0 0 0-1.2L8.06 3.6A.7.7 0 0 0 7 4.2Z"/>',
    'forward-step': '<path d="M5 4.3v15.4a.6.6 0 0 0 .9.5l10.4-7.7a.6.6 0 0 0 0-1L5.9 3.8a.6.6 0 0 0-.9.5Z"/><rect x="17.3" y="4" width="2.2" height="16" rx="1"/>',
    'right-from-bracket': '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',

    'trash': '<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13"/>',
    'shuffle': '<path d="M4 6h3.3L16 18h4M17 6h3v3M20 18v-3l-3 3M4 18h3.3L11 13"/>',
    'table-cells': '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    'arrows-left-right': '<path d="m8 3-4 4 4 4M4 7h9M16 21l4-4-4-4M20 17h-9"/>',

    'check': '<path d="M4 12.5 9.2 18 20 6"/>',
    'triangle-exclamation': '<path d="M12 3 2 20h20L12 3Z"/><path d="M12 9.8v4M12 17v.01"/>',
    'xmark': '<path d="M6 6 18 18M18 6 6 18"/>',
    'plus': '<path d="M12 5v14M5 12h14"/>',
    'caret-up': '<path d="M6 15l6-6 6 6"/>',
    'caret-down': '<path d="M6 9l6 6 6-6"/>',
    'circle-check': '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 10"/>',
    'champagne-glasses': '<path d="M12 2v3M6.5 6.5l1.6 1.6M17.5 6.5l-1.6 1.6M4 21l8-14 8 14"/><circle cx="12" cy="12.5" r=".6" fill="currentColor" stroke="none"/>',
    'bookmark': '<path d="M6 3.5A1.5 1.5 0 0 1 7.5 2h9A1.5 1.5 0 0 1 18 3.5V21l-6-4-6 4V3.5Z"/>',
    'list-preset': '<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h5"/>',

function svgIcon(name) { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }
function initStaticIcons() { document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = svgIcon(el.dataset.icon)); }
initStaticIcons();

// ============================================================
// 状态管理
// ============================================================
let images = [];
let currentIndex = 0;
let currentMode = 'practice';
let practiceTime = 30;
let timeRemaining = 0;
let timerInterval = null;
let isPaused = false;
let sessionQueue = [];
let queueIndex = 0;
let customRows = [{ count: 1, seconds: 30, isRest: false }];
let selectedRowIndex = 0;
let justAddedIndex = null;
let isFlipped = false;
let isBW = false;
let showInfo = false;
let showTimer = true;
let isGrid = false;
let isShuffle = false;
let soundEnabled = true;
let audioCtx = null;
let playedHistory = [];
let unplayedIndices = []; // 抽奖袋
const RING_CIRCUMFERENCE = 2 * Math.PI * 34;
const CLASS_FIXED_SECONDS = 30;
let toolbarPinned = false;
let pinTimeout = null;

// DOM
const setupScreen = document.getElementById('setup-screen');
const playScreen = document.getElementById('play-screen');
// 【修复】将 const 更改为 let，允许在 iOS 重新分配 input 元素
let fileInput = document.getElementById('file-input');
const startBtn = document.getElementById('start-btn');
const folderStatus = document.getElementById('folder-status');
const tabContent = document.getElementById('tab-content');
const canvasImg = document.getElementById('canvas-img');
const timerDisplay = document.getElementById('timer-display');
const timerBadge = document.getElementById('timer-badge');
const timerRingFg = document.getElementById('timer-ring-fg');
const topInfo = document.getElementById('top-info');
const btnPause = document.getElementById('btn-pause');
const restOverlay = document.getElementById('rest-overlay');
const stepCounter = document.getElementById('step-counter');
const progressTrack = document.getElementById('progress-track');
const toastStack = document.getElementById('toast-stack');
const interactionLayer = document.getElementById('interaction-layer');

timerRingFg.setAttribute('stroke-dasharray', RING_CIRCUMFERENCE.toFixed(1));

// ============================================================
// 音频与提示
// ============================================================
function playBeepSound(isEnd = false) {
    if (!soundEnabled) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isEnd ? 780 : 580, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(isEnd ? 0.12 : 0.08, audioCtx.currentTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (isEnd ? 0.35 : 0.18));
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + (isEnd ? 0.35 : 0.18));
    } catch (e) {}
}

function toast(message, opts = {}) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<i class="icon-inline">${svgIcon(opts.icon || 'circle-check')}</i><span>${message}</span>`;
    toastStack.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, opts.duration || 2600);
}

// ============================================================
// iPad 触控交互与防误触
// ============================================================
function pokeToolbar() {
    toolbarPinned = true;
    playScreen.classList.add('toolbar-pinned');
    clearTimeout(pinTimeout);
    if (!isPaused) {
        pinTimeout = setTimeout(() => {
            toolbarPinned = false;
            playScreen.classList.remove('toolbar-pinned');
        }, 3000);
    }
}
interactionLayer.addEventListener('click', () => {
    if (justSwiped || justDragged) { justSwiped = false; justDragged = false; return; }
    toolbarPinned = !toolbarPinned;
    playScreen.classList.toggle('toolbar-pinned', toolbarPinned);
    clearTimeout(pinTimeout);
    if (toolbarPinned && !isPaused) {
        pinTimeout = setTimeout(() => {
            toolbarPinned = false;
            playScreen.classList.remove('toolbar-pinned');
        }, 3000);
    }
});

// ============================================================
// 【核心修复】图片缩放引擎：支持防糊硬件加速
// ============================================================
let imgScale = 1, imgPanX = 0, imgPanY = 0, imgOriginX = 50, imgOriginY = 50;
const ZOOM_MIN = 1, ZOOM_MAX = 4;

function applyImgTransform() {
    canvasImg.style.transformOrigin = `${imgOriginX}% ${imgOriginY}%`;
    const flipPart = isFlipped ? 'scaleX(-1) ' : '';
    // 【修复】加入 translateZ(0) 强制激活苹果 GPU 硬件渲染，解决放大变模糊和失真的问题
    canvasImg.style.transform = `${flipPart}translate(${imgPanX}px, ${imgPanY}px) scale(${imgScale}) translateZ(0)`;
    canvasImg.classList.toggle('is-zoomed', imgScale > 1.001);
}
function setZoomOrigin(clientX, clientY) {
    imgOriginX = (clientX / window.innerWidth) * 100;
    imgOriginY = (clientY / window.innerHeight) * 100;
}
function resetZoomState() {
    imgScale = 1; imgPanX = 0; imgPanY = 0; imgOriginX = 50; imgOriginY = 50;
    canvasImg.classList.remove('is-zoomed', 'is-dragging');
    applyImgTransform();
}

// ============================================================
// 【核心修复】触控手势：加入 60 帧 requestAnimationFrame 解决卡顿
// ============================================================
let touchStartX = 0, touchStartY = 0, touchStartTime = 0, justSwiped = false, justDragged = false;
let lastTapTime = 0;
let pinchStartDist = 0, pinchStartScale = 1, isPinching = false;
let panLastX = 0, panLastY = 0;
let rafPending = false; // 渲染锁
const SWIPE_THRESHOLD = 48;
const touchDist = (t0, t1) => Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);

interactionLayer.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        isPinching = true;
        // 【修复】马上移除动画过渡，防止由于动画干扰造成橡胶带一样的卡顿手感
        canvasImg.classList.add('is-dragging');
        pinchStartDist = touchDist(e.touches[0], e.touches[1]);
        pinchStartScale = imgScale;
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        setZoomOrigin(midX, midY);
    } else if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; touchStartTime = Date.now();
        if (imgScale > 1) { panLastX = touchStartX; panLastY = touchStartY; canvasImg.classList.add('is-dragging'); }
    }
}, { passive: true });

interactionLayer.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
        e.preventDefault(); 
        if(rafPending) return;
        rafPending = true;
        const newDist = touchDist(e.touches[0], e.touches[1]);
        imgScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, pinchStartScale * (newDist / pinchStartDist)));
        requestAnimationFrame(() => { applyImgTransform(); rafPending = false; });
    } else if (e.touches.length === 1 && imgScale > 1) {
        if(rafPending) return;
        rafPending = true;
        const dx = e.touches[0].clientX - panLastX, dy = e.touches[0].clientY - panLastY;
        panLastX = e.touches[0].clientX; panLastY = e.touches[0].clientY;
        imgPanX += dx; imgPanY += dy;
        requestAnimationFrame(() => { applyImgTransform(); rafPending = false; });
    }
}, { passive: false });

interactionLayer.addEventListener('touchend', (e) => {
    canvasImg.classList.remove('is-dragging');
    
    if (isPinching) {
        isPinching = false; justDragged = true;
        if (imgScale <= 1.001) { imgPanX = 0; imgPanY = 0; } 
        if (e.touches.length === 1) { panLastX = e.touches[0].clientX; panLastY = e.touches[0].clientY; }
        return;
    }

    const touch = e.changedTouches[0]; if (!touch) return;
    const dx = touch.clientX - touchStartX, dy = touch.clientY - touchStartY;
    const dt = Date.now() - touchStartTime;

    // 【核心修复】将双击检测移到了最前面！现在即使图片是在放大状态，双击依然能执行重置
    const now = Date.now();
    if (now - lastTapTime < 320 && Math.abs(dx) < 12 && Math.abs(dy) < 12) {
        lastTapTime = 0;
        resetZoomState(); 
        justDragged = true; // 防止触发其它误点击
        return;
    } else {
        lastTapTime = now;
    }

    // 单指操作的平移返回判定
    if (imgScale > 1) { justDragged = true; return; }

    // 左右切图
    if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 600) {
        justSwiped = true;
        if (dx < 0) nextImg(); else prevImg();
        return;
    }
}, { passive: true });

// ============================================================
// 桌面端：鼠标滚轮缩放 / 拖动平移 / 双击恢复原始大小
// ============================================================
interactionLayer.addEventListener('wheel', (e) => {
    e.preventDefault();
    setZoomOrigin(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    imgScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, imgScale * factor));
    if (imgScale <= 1.001) { imgPanX = 0; imgPanY = 0; }
    applyImgTransform();
}, { passive: false });

let isMouseDragging = false, mouseDragLastX = 0, mouseDragLastY = 0;
interactionLayer.addEventListener('mousedown', (e) => {
    if (imgScale <= 1) return;
    isMouseDragging = true; mouseDragLastX = e.clientX; mouseDragLastY = e.clientY;
    canvasImg.classList.add('is-dragging');
});
window.addEventListener('mousemove', (e) => {
    if (!isMouseDragging) return;
    const dx = e.clientX - mouseDragLastX, dy = e.clientY - mouseDragLastY;
    mouseDragLastX = e.clientX; mouseDragLastY = e.clientY;
    imgPanX += dx; imgPanY += dy;
    applyImgTransform();
});
window.addEventListener('mouseup', () => {
    if (!isMouseDragging) return;
    isMouseDragging = false; justDragged = true;
    canvasImg.classList.remove('is-dragging');
});

async function collectFilesFromDataTransfer(dataTransfer) {
    const out = [];
    const items = dataTransfer.items;
    if (items && items.length && items[0].webkitGetAsEntry) {
        async function walk(entry) {
            if (!entry) return;
            if (entry.isFile) {
                await new Promise(res => entry.file(f => { out.push(f); res(); }));
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                const readAll = () => new Promise(res => reader.readEntries(res));
                let batch;
                do { batch = await readAll(); for (const e of batch) await walk(e); } while (batch.length > 0);
            }
        }
        const entries = Array.from(items).map(it => it.webkitGetAsEntry && it.webkitGetAsEntry());
        for (const en of entries) await walk(en);
    } else {
        out.push(...Array.from(dataTransfer.files));
    }
    return out;
}

function handleIncomingFiles(fileList) {

function initShuffleBag() {
    unplayedIndices = [];
    for (let i = 0; i < images.length; i++) {
        if (i !== currentIndex) unplayedIndices.push(i);
    }
    for (let i = unplayedIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [unplayedIndices[i], unplayedIndices[j]] = [unplayedIndices[j], unplayedIndices[i]];
    }
}

function pickNextIndex() {
    if (images.length <= 1) return 0;
    playedHistory.push(currentIndex);
    if (!isShuffle) return (currentIndex + 1) % images.length;
    
    if (unplayedIndices.length === 0) {
        for (let i = 0; i < images.length; i++) unplayedIndices.push(i);
        for (let i = unplayedIndices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [unplayedIndices[i], unplayedIndices[j]] = [unplayedIndices[j], unplayedIndices[i]];
        }
    }
    return unplayedIndices.pop();
}

function pickPrevIndex() {
    if (images.length <= 1) return 0;
    if (playedHistory.length > 0) {
        let prev = playedHistory.pop();
        if (isShuffle) {
            unplayedIndices.push(currentIndex);
            for (let i = unplayedIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [unplayedIndices[i], unplayedIndices[j]] = [unplayedIndices[j], unplayedIndices[i]];
            }
        }
        return prev;
    }
    return (currentIndex - 1 + images.length) % images.length;
}

function buildQueue(rows) {
    const q = [];
    rows.forEach(r => { if (r.isRest) q.push({ type: 'rest', seconds: r.seconds }); else { for (let i = 0; i < r.count; i++) q.push({ type: 'image', seconds: r.seconds }); } });
    return q;
}
function startStructuredSession() { sessionQueue = buildQueue(customRows); queueIndex = 0; stepCounter.classList.remove('hidden-ui'); runQueueStep(); }
function runQueueStep() {
    if (queueIndex >= sessionQueue.length) { finishStructuredSession(); return; }
    const step = sessionQueue[queueIndex]; updateStructuredProgressUI();
    if (step.type === 'rest') { showRestOverlay(true); beginCountdown(step.seconds, advanceQueue); }
    else { showRestOverlay(false); loadCurrentImage(() => beginCountdown(step.seconds, advanceQueue)); }
}
function advanceQueue() {
    clearInterval(timerInterval); const finished = sessionQueue[queueIndex]; queueIndex++;
    if (finished && finished.type === 'image' && images.length > 0) currentIndex = pickNextIndex();
    runQueueStep();
}
function finishStructuredSession() {
    showRestOverlay(false); stepCounter.classList.add('hidden-ui'); progressTrack.style.width = '0%';
    exitToMenu(); toast('训练完成,辛苦了!', { icon: 'champagne-glasses' });
}
function updateStructuredProgressUI() {
    stepCounter.textContent = `第 ${queueIndex + 1} / ${sessionQueue.length} 步`;
    const total = sessionQueue.reduce((s, st) => s + st.seconds, 0); const elapsed = sessionQueue.slice(0, queueIndex).reduce((s, st) => s + st.seconds, 0);
    progressTrack.style.width = `${total > 0 ? (elapsed / total) * 100 : 0}%`;
}
function showRestOverlay(on) {
    restOverlay.classList.toggle('hidden-ui', !on); canvasImg.classList.toggle('is-resting', on); timerBadge.classList.toggle('is-rest', on);
}

function beginCountdown(totalSeconds, onComplete) {
    clearInterval(timerInterval); timeRemaining = totalSeconds; updateCountdownDisplay(totalSeconds);
    if (showTimer) { timerBadge.classList.remove('hidden-ui'); } else { timerBadge.classList.add('hidden-ui'); }
    timerInterval = setInterval(() => {
        if (isPaused) return;
        timeRemaining--; updateCountdownDisplay(totalSeconds);
        if (timeRemaining <= 0) { clearInterval(timerInterval); playBeepSound(true); onComplete && onComplete(); }
    }, 1000);
}

function updateCountdownDisplay(total) {
    const clamped = Math.max(0, timeRemaining);
    const isDangerTime = (clamped <= 5 && clamped > 0 && currentMode !== 'relaxed');
    timerBadge.classList.toggle('is-danger', isDangerTime);
    if (isDangerTime) playBeepSound(false);

    if (clamped >= 60) {
        const m = Math.floor(clamped / 60).toString().padStart(2, '0'); const s = (clamped % 60).toString().padStart(2, '0'); timerDisplay.textContent = `${m}:${s}`;
    } else { timerDisplay.textContent = clamped; }
    const frac = total > 0 ? clamped / total : 0;
    timerRingFg.setAttribute('stroke-dashoffset', (RING_CIRCUMFERENCE * (1 - frac)).toFixed(1));
}

function loadCurrentImage(afterLoad, skipAttempts) {
    if (images.length === 0) { exitToMenu(); return; }
    skipAttempts = skipAttempts || 0;
    const file = images[currentIndex]; const objectURL = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
        resetZoomState();
        canvasImg.src = objectURL;
        document.getElementById('info-name').innerText = file.name;
        document.getElementById('info-details').innerText = `${this.width}x${this.height} px / ${(file.size / 1024).toFixed(0)} KB`;
        updateVisuals();
        if (currentMode !== 'custom') { stepCounter.classList.remove('hidden-ui'); stepCounter.textContent = `第 ${currentIndex + 1} / ${images.length} 张`; }
        if (afterLoad) afterLoad(); else startTimerLogic();
    };
    img.onerror = function () {
        URL.revokeObjectURL(objectURL);
        toast(`「${file.name}」格式无法显示,已跳过`, { icon: 'triangle-exclamation' });
        images.splice(currentIndex, 1);
        if (images.length === 0) { toast('所有图片都无法加载,请检查图片格式', { icon: 'triangle-exclamation' }); exitToMenu(); return; }
        if (skipAttempts >= images.length) { toast('图片均无法加载,请检查文件格式', { icon: 'triangle-exclamation' }); exitToMenu(); return; }
        if (currentIndex >= images.length) currentIndex = 0;
        loadCurrentImage(afterLoad, skipAttempts + 1);
    };
    img.src = objectURL;
}

function startTimerLogic() {
    clearInterval(timerInterval); timerBadge.classList.remove('is-danger');
    if (currentMode === 'relaxed') {
        timeRemaining = 0; timerDisplay.textContent = '00:00'; timerRingFg.setAttribute('stroke-dashoffset', '0');
        if (showTimer) timerBadge.classList.remove('hidden-ui'); else timerBadge.classList.add('hidden-ui');
        timerInterval = setInterval(() => {
            if (isPaused) return; timeRemaining++;
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0'); const s = (timeRemaining % 60).toString().padStart(2, '0'); timerDisplay.textContent = `${m}:${s}`;
        }, 1000);
    } else {
        const seconds = currentMode === 'class' ? CLASS_FIXED_SECONDS : practiceTime;
        beginCountdown(seconds, () => { currentIndex = pickNextIndex(); loadCurrentImage(); });
    }
}

function nextImg() {
    if (images.length === 0) return; pokeToolbar();
    if (currentMode === 'custom') advanceQueue(); else { currentIndex = pickNextIndex(); loadCurrentImage(); }
}
function prevImg() {
    if (images.length === 0) return; pokeToolbar();
    if (currentMode === 'custom') {
        if (queueIndex > 0) { clearInterval(timerInterval); queueIndex--; if (sessionQueue[queueIndex].type === 'image' && images.length > 0) currentIndex = pickPrevIndex(); runQueueStep(); }
    } else { currentIndex = pickPrevIndex(); loadCurrentImage(); }
}
function togglePause() {
    isPaused = !isPaused;
    btnPause.innerHTML = isPaused ? `<i class="icon-inline">${svgIcon('play')}</i>` : `<i class="icon-inline">${svgIcon('pause')}</i>`;
    if (isPaused) { toolbarPinned = true; playScreen.classList.add('toolbar-pinned'); clearTimeout(pinTimeout); }
    else pokeToolbar();
}
function deleteImg() {
    if (images.length === 0) return; images.splice(currentIndex, 1);
    if (images.length === 0) { exitToMenu(); return; }
    if (currentIndex >= images.length) currentIndex = 0;
    if (isShuffle) initShuffleBag();
    if (currentMode === 'custom') { const step = sessionQueue[queueIndex]; if (step && step.type === 'image') loadCurrentImage(() => {}); }
    else loadCurrentImage();
}
function exitToMenu() {
    resetZoomState();
    clearInterval(timerInterval); timerBadge.classList.remove('is-danger'); showRestOverlay(false);
    stepCounter.classList.add('hidden-ui'); progressTrack.style.width = '0%';
    playScreen.classList.add('hidden-ui'); setupScreen.classList.remove('hidden-ui'); setupScreen.classList.add('screen-fade');
    if (images.length === 0) { folderStatus.innerHTML = ''; startBtn.disabled = true; }
}

function updateVisuals() {
    applyImgTransform();
    canvasImg.style.filter = isBW ? 'grayscale(100%) contrast(120%)' : 'none';
}
function toggleFlip() { isFlipped = !isFlipped; updateVisuals(); }
function toggleBW() { isBW = !isBW; document.getElementById('btn-bw').classList.toggle('active', isBW); updateVisuals(); }
function toggleInfo() { showInfo = !showInfo; topInfo.classList.toggle('hidden-ui', !showInfo); document.getElementById('btn-info').classList.toggle('active', showInfo); }
function toggleGrid() { isGrid = !isGrid; document.getElementById('grid-overlay').classList.toggle('hidden-ui', !isGrid); document.getElementById('btn-grid').classList.toggle('active', isGrid); }
function toggleTimerVis() { showTimer = !showTimer; timerBadge.classList.toggle('hidden-ui', !showTimer); document.getElementById('btn-timer').classList.toggle('active', showTimer); }
function toggleSound() { soundEnabled = !soundEnabled; const btn = document.getElementById('btn-sound'); btn.classList.toggle('active', soundEnabled); btn.innerHTML = svgIcon(soundEnabled ? 'volume-high' : 'volume-xmark'); }
function toggleShuffle() { isShuffle = !isShuffle; playedHistory = []; if (isShuffle) initShuffleBag(); document.getElementById('btn-shuffle').classList.toggle('active', isShuffle); }

document.addEventListener('keydown', (e) => {
    if (playScreen.classList.contains('hidden-ui')) return;
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    if (e.code === 'ArrowRight') nextImg();
    if (e.code === 'ArrowLeft') prevImg();
    if (e.code === 'Escape') exitToMenu();
    if (e.key === 'g' || e.key === 'G') toggleGrid();
    if (e.key === 'f' || e.key === 'F') toggleFlip();
    if (e.key === 'b' || e.key === 'B') toggleBW();
    if (e.key === 'i' || e.key === 'I') toggleInfo();
    if (e.key === 't' || e.key === 'T') toggleTimerVis();
    if (e.key === 's' || e.key === 'S') toggleShuffle();
    if (e.key === 'm' || e.key === 'M') toggleSound();
});
</script>

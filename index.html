<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>T门动态速写</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T门动态速写">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
    /* 核心颜色变量 */
    :root{
        --bg-canvas:#EBE5F5;
        --bg-panel:#FFFFFF;
        --bg-panel-alt:#F4EFFB;
        --bg-panel-hover:#ECE4F7;
        --border:#D6C8EE;
        --border-soft:#E4DCF4;
        --text:#2D253A;
        --text-muted:#7A6E8D;
        --text-faint:#AB9FC0;
        --ink:#2D253A;
        --accent:#9D75E6;
        --accent-hover:#8B5FD6;
        --accent-ink:#FFFFFF;
        --accent-soft:rgba(157,117,230,.15);
        --mode-class:#D2A272;
        --mode-class-soft:#F8F0E3;
        --mode-relaxed:#8FAAC0;
        --mode-relaxed-soft:#EEF3F6;
        --mode-custom:#BB8CA6;
        --mode-custom-soft:#F6ECF1;
        --rest:#D8B378;
        --rest-ink:#221F19;
        --rest-soft:#F9F0DE;
        --danger:#C2564A;
        --danger-soft:#F6E3E0;
    }
    
    /* 基础重置 (摆脱外部依赖) */
    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{
        height: 100%; width: 100%;
        background:var(--bg-canvas);
        color:var(--text);
        font-family:'Inter',sans-serif;
        overflow:hidden;
        -webkit-tap-highlight-color: transparent;
    }
    .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
    .font-round{font-family:'Fraunces',ui-serif,'Inter',sans-serif; font-optical-sizing:auto;}
    
    /* 图标统一样式 */
    i[data-icon], i.icon-inline{ display:inline-flex; width:1em; height:1em; align-items:center; justify-content:center; }
    i[data-icon] svg, i.icon-inline svg{ width:1em; height:1em; display:block; flex-shrink:0; vertical-align:middle; }
    .hidden-ui{display:none !important;}
    
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

    /* ================= 设置主屏幕 ================= */
    #setup-screen{
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
            radial-gradient(ellipse 800px 480px at 12% -8%, rgba(157,117,230,.22), transparent 60%),
            radial-gradient(ellipse 700px 420px at 105% 10%, rgba(210,162,114,.16), transparent 60%),
            radial-gradient(ellipse 700px 460px at 0% 105%, rgba(187,140,166,.14), transparent 55%),
            var(--bg-canvas);
    }
    .setup-card{
        background:var(--bg-panel);
        border:1px solid var(--border-soft);
        border-radius:28px;
        box-shadow:0 30px 60px -25px rgba(45,37,58,.22), 0 2px 8px rgba(45,37,58,.04);
        width: 540px; max-width: 92%;
        padding: 36px 40px;
        display: flex; flex-direction: column; align-items: center;
    }
    .setup-title { font-size: 30px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.025em; }
    .setup-title .highlight { font-weight: 700; color: var(--accent-hover); }
    .setup-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 28px; letter-spacing: 0.025em; }

    /* 文件选择器 */
    .folder-drop{
        width: 100%; padding: 16px 0; text-align: center; cursor: pointer;
        font-size: 15px; font-weight: 600;
        border:1.5px solid transparent; border-radius:18px;
        background:rgba(157,117,230,.12);
        transition:background .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
    }
    .folder-drop:hover{ background:var(--bg-panel); border-color:var(--accent); box-shadow:0 8px 20px -12px rgba(157,117,230,.5); transform:translateY(-1px); }
    .folder-drop:hover .folder-drop-icon{ color:var(--accent); }
    .folder-drop:active{ transform:scale(.985); }
    .folder-drop-icon { margin-right: 8px; color: var(--accent-hover); }
    #file-input { display: none !important; } /* 彻底隐藏原生按钮 */
    #folder-status { font-size: 12px; color: var(--text-muted); margin-top: 8px; height: 16px; }

    /* 模式面板 */
    .mode-section { width: 100%; border-top: 1px solid var(--border-soft); padding-top: 24px; margin-top: 20px; }
    .mode-title { text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.05em; }
    .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom: 20px; }
    
    .tab-btn{
        padding:16px 10px; display:flex; flex-direction:column; align-items:flex-start; gap:14px;
        cursor:pointer; color:var(--text-muted); background:var(--bg-panel-alt);
        border-radius:18px; transition:background .18s ease, color .18s ease, transform .15s ease, box-shadow .18s ease, border-color .18s ease;
        position:relative; border:1.5px solid transparent; overflow:hidden;
    }
    .tab-btn:hover{ transform:translateY(-2px); border-color:var(--border); box-shadow:0 10px 22px -14px rgba(45,37,58,.25); }
    .tab-btn .tab-icon{
        width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center;
        background:rgba(255,255,255,.7); font-size:16px; transition:background .18s ease, transform .18s ease;
    }
    .tab-btn:hover .tab-icon{ transform:scale(1.06); }
    .tab-btn[data-tab="practice"].active{ background:var(--accent); color:var(--accent-ink); box-shadow:0 12px 24px -14px rgba(157,117,230,.7); }
    .tab-btn[data-tab="class"].active{ background:var(--mode-class); color:var(--accent-ink); box-shadow:0 12px 24px -14px rgba(210,162,114,.7); }
    .tab-btn[data-tab="relaxed"].active{ background:var(--mode-relaxed); color:var(--accent-ink); box-shadow:0 12px 24px -14px rgba(143,170,192,.7); }
    .tab-btn[data-tab="custom"].active{ background:var(--mode-custom); color:var(--accent-ink); box-shadow:0 12px 24px -14px rgba(187,140,166,.7); }
    .tab-btn.active{ transform:translateY(-1px); }
    .tab-btn.active .tab-icon{ background:rgba(255,255,255,.25); }
    .tab-btn span{ font-size:13.5px; font-weight:600; }

    .tab-content-container { min-height: 92px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    
    .time-btn-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; width: 100%; }
    .time-btn{
        background:var(--bg-panel-alt); color:var(--text-muted); border:1.5px solid var(--border-soft);
        padding:9px 14px; cursor:pointer; font-size:13.5px; border-radius:99px; transition:all .15s ease; font-weight:500;
    }
    .time-btn:hover:not(.active):not(.is-disabled){ background:var(--bg-panel-hover); color:var(--text); border-color:var(--border); transform:translateY(-1px); }
    .time-btn.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; box-shadow:0 8px 16px -10px rgba(157,117,230,.7); }
    .time-btn:active:not(.is-disabled){ transform:scale(.96); }

    /* 通用按钮 */
    .btn-primary{
        background:var(--ink); color:#fff; font-weight:600; border:none; outline:none;
        transition:background .18s ease, transform .12s ease, box-shadow .18s ease;
        box-shadow:0 10px 26px -10px rgba(45,37,58,.35);
        position:relative; overflow:hidden; cursor:pointer;
    }
    .btn-primary::after{
        content:""; position:absolute; inset:0; opacity:0;
        background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.14) 50%, transparent 70%);
        transform:translateX(-100%); transition:opacity .2s ease;
    }
    .btn-primary:hover::after{ opacity:1; animation:btnSheen 1.1s ease; }
    @keyframes btnSheen{ from{ transform:translateX(-100%); } to{ transform:translateX(100%); } }
    .btn-primary:hover{ background:#423753; box-shadow:0 14px 30px -10px rgba(45,37,58,.45); }
    .btn-primary:active{ transform:scale(.98); }
    .btn-primary:disabled{ background:var(--bg-panel-alt); color:var(--text-faint); box-shadow:none; cursor:not-allowed; }
    .btn-primary:disabled::after{ display:none; }
    
    .start-btn { width: 100%; padding: 14px 0; font-size: 15px; border-radius: 99px; margin-top: 8px; letter-spacing: 0.025em; }

    .btn-ghost{
        background:var(--bg-panel-alt); color:var(--text); border:1px solid var(--border-soft);
        transition:all .15s ease; border-radius: 8px; cursor: pointer; outline: none;
    }
    .btn-ghost:hover{ background:var(--bg-panel-hover); border-color:var(--border); transform:translateY(-1px); }
    .btn-ghost:active{ transform:scale(.97); }
    .footer-btn { padding: 8px 24px; font-size: 14px; }

    /* ================= 播放界面 ================= */
    #play-screen{
        position: fixed; inset: 0; background: #18141F; overflow: hidden; z-index: 50;
    }
    #play-vignette{
        position:absolute; inset:0; pointer-events:none; z-index:1;
        background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
    }
    /* 图片完全脱离文档流，绝对定位满屏，靠 object-fit 缩放不影响任何 UI */
    #canvas-img{
        position:absolute; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: contain; 
        transition: transform .2s ease, filter .2s ease, opacity .3s ease;
        z-index: 2; pointer-events: none;
    }
    #canvas-img.is-resting{ opacity:.15; filter:blur(2px) grayscale(60%); }

    /* 检测点击的透明层 */
    #interaction-layer { position: absolute; inset: 0; z-index: 5; cursor: default; touch-action: none; }

    #grid-overlay{
        position:absolute; inset:0; pointer-events:none; z-index: 3;
        background-image: linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
        background-size:100px 100px; background-position:center center;
    }

    #top-info{
        position:absolute; top:18px; left:50%; transform:translateX(-50%);
        text-align:center; color:rgba(255,255,255,.85); font-size:13px; z-index:10; pointer-events:none;
        background:rgba(30,25,38,.65); backdrop-filter:blur(8px);
        padding:6px 16px; border-radius:99px; border:1px solid rgba(255,255,255,.08);
    }
    #top-info #info-details{ color:rgba(255,255,255,.5); }

    #progress-track{
        position:absolute; top:0; left:0; height:3px; background:var(--mode-color, var(--accent)); z-index:11;
        transition:width .3s linear, background .3s ease; box-shadow:0 0 12px color-mix(in srgb, var(--mode-color, var(--accent)) 60%, transparent);
    }

    #step-counter{
        position:absolute; top:18px; left:18px; z-index:10;
        font-size:12px; color:rgba(255,255,255,.7); background:rgba(30,25,38,.65);
        backdrop-filter:blur(8px); padding:6px 12px; border-radius:99px;
        border:1px solid rgba(255,255,255,.08); letter-spacing:.02em;
    }

    #timer-badge{
        position:absolute; top:16px; right:16px; z-index:10;
        width:78px; height:78px; display:flex; align-items:center; justify-content:center;
    }
    #timer-badge svg{ position:absolute; inset:0; transform:rotate(-90deg); }
    #timer-ring-bg{ stroke:rgba(255,255,255,.12); }
    #timer-ring-fg{ stroke:var(--mode-color, var(--accent)); transition:stroke-dashoffset 1s linear, stroke .3s ease; stroke-linecap:round; }
    #timer-badge.is-rest #timer-ring-fg{ stroke:var(--rest); }
    #timer-badge.is-danger #timer-ring-fg{ stroke:var(--danger) !important; }
    #timer-badge.is-danger #timer-display{ color:var(--danger) !important; animation:pulseWarning .8s ease infinite alternate; }
    @keyframes pulseWarning{ from{ transform:scale(1); } to{ transform:scale(1.08); } }
    #timer-display{ font-size:19px; font-weight:600; color:white; z-index:2; letter-spacing:.02em; text-shadow:0 1px 3px rgba(0,0,0,.6); transition:color .3s ease; }

    #rest-overlay{
        position:absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index:9; display:flex; flex-direction:column; align-items:center; gap:10px;
        color:rgba(255,255,255,.92); pointer-events:none;
    }
    #rest-overlay i{ font-size:34px; color:var(--rest); }
    #rest-overlay span{ font-size:15px; letter-spacing:.04em; }

    /* 底部控制栏 */
    .bottom-toolbar{
        position:absolute; bottom:22px; left:50%; z-index:20;
        background:rgba(28,23,36,.92); backdrop-filter:blur(16px);
        border:1px solid rgba(255,255,255,.08); border-radius:32px; padding:14px 24px 12px;
        display:flex; flex-direction:column; align-items:center; gap:10px;
        box-shadow:0 24px 50px -14px rgba(0,0,0,.6);
        opacity:0; transform:translate(-50%,16px); transition:opacity .25s ease, transform .25s ease;
    }
    /* 【修复 2】排除了触控设备，解决 iPad 笔离开后工具栏不消失的 Bug */
    body:not(.touch-device) #play-screen:hover .bottom-toolbar { opacity:1; transform:translate(-50%,0); }
    #play-screen.toolbar-pinned .bottom-toolbar { opacity:1; transform:translate(-50%,0); }
    
    .toolbar-row-divider{ width:100%; height:1px; background:rgba(255,255,255,.08); }

    .controls-main{ display:flex; align-items:center; gap:22px; }
    .ctrl-btn{
        color:#fff; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
        font-size:16px; background:rgba(255,255,255,.06); transition:background .16s ease, transform .16s ease, box-shadow .16s ease;
        border: none; cursor: pointer; outline: none;
    }
    .ctrl-btn:hover{ background:rgba(255,255,255,.14); transform:scale(1.07); box-shadow:0 4px 14px -4px rgba(0,0,0,.5); }
    .ctrl-btn:active{ transform:scale(.9); }
    .ctrl-btn.big{ width:54px; height:54px; font-size:19px; background:var(--mode-color, var(--accent)); color:var(--accent-ink); box-shadow:0 6px 18px -6px var(--mode-color, var(--accent)); }
    .ctrl-btn.big:hover{ filter:brightness(1.1); transform:scale(1.06); box-shadow:0 8px 22px -6px var(--mode-color, var(--accent)); }
    .ctrl-btn.big:active{ transform:scale(.94); }
    .skip-btn{
        display:flex; align-items:center; gap:6px; color:rgba(255,255,255,.7); font-size:12.5px;
        letter-spacing:.06em; text-transform:uppercase; font-weight:600; transition:color .15s ease, transform .15s ease;
        background: none; border: none; cursor: pointer;
    }
    .skip-btn:hover{ color:#fff; transform:translateX(2px); }

    .controls-tools{ display:flex; align-items:center; gap:6px; font-size:15px; color:#b0a6c2; }
    .tool-btn{
        width:36px; height:36px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center;
        font-size:16px; transition:background .15s ease, color .15s ease;
        background: none; border: none; cursor: pointer; color: inherit;
    }
    .tool-btn svg{ width:1em; height:1em; display:block; flex-shrink:0; }
    .tool-btn:hover{ background:rgba(255,255,255,.08); color:#fff; }
    .tool-btn:active{ transform:scale(.95); }
    .tool-btn.active{ background:rgba(157,117,230,.25); color:#d9c9fb; box-shadow:none; }
    .tool-divider{ width:1px; height:18px; background:rgba(255,255,255,.14); margin:0 2px; }

    /* ================= 弹窗与悬浮 ================= */
    #custom-modal-overlay{
        position:fixed; inset:0; background:rgba(18,14,24,.75); backdrop-filter:blur(3px);
        display:flex; justify-content:center; align-items:center; z-index:100;
        animation:overlayFadeIn .2s ease;
    }
    .custom-modal{
        background:var(--bg-panel); border-radius:16px; box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
        width:660px; max-width: 94%; display:flex; flex-direction:column; border:1px solid var(--border-soft); overflow:hidden;
        animation:modalPopIn .25s cubic-bezier(.2,.8,.3,1.1); position:relative;
